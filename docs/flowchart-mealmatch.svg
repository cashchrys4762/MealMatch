<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2920 680" width="2920" height="680" role="img" aria-label="แผนผังการทำงาน MealMatch แบบแนวนอน">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#3d4f42"/>
    </marker>
    <filter id="soft" x="-10%" y="-14%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#2f4a34" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6faf6"/>
    </linearGradient>
    <style type="text/css">
      text { font-family: Sarabun, "Noto Sans Thai", "Leelawadee UI", sans-serif; fill: #1f2a22; }
      .title { font-size: 28px; font-weight: 700; fill: #244433; }
      .sub { font-size: 14px; fill: #5f7264; }
      .t { font-size: 13.5px; font-weight: 600; }
      .s { font-size: 12px; fill: #44574c; }
      .e { font-size: 12px; font-weight: 700; fill: #355043; }
      .legend { font-size: 12.5px; fill: #44574c; }
      .term { fill: #d8f0df; stroke: #3f8f5a; stroke-width: 1.8; }
      .io { fill: #fff1c9; stroke: #c7952a; stroke-width: 1.8; }
      .proc { fill: #dcecf8; stroke: #4a7fb0; stroke-width: 1.8; }
      .dec { fill: #f8d9de; stroke: #c15b6a; stroke-width: 1.8; }
      .line { stroke: #3d4f42; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="16" y="16" width="2888" height="648" rx="28" fill="url(#card)" stroke="#d7e2d8" stroke-width="1.5"/>

  <text x="1460" y="56" text-anchor="middle" class="title">แผนผังการทำงาน MealMatch</text>
  <text x="1460" y="82" text-anchor="middle" class="sub">แนวการไหลจากซ้ายไปขวา · แนะนำเมนูตามงบประมาณและเป้าหมายสุขภาพ</text>

  <!-- สัญลักษณ์ -->
  <g transform="translate(80,108)">
    <rect x="0" y="0" width="78" height="26" rx="13" class="term" filter="url(#soft)"/>
    <text x="90" y="18" class="legend">จุดเริ่ม / จบ</text>

    <polygon points="200,2 278,2 268,24 190,24" class="io" filter="url(#soft)"/>
    <text x="290" y="18" class="legend">รับข้อมูล / แสดงผล</text>

    <rect x="430" y="0" width="78" height="26" rx="5" class="proc" filter="url(#soft)"/>
    <text x="520" y="18" class="legend">การประมวลผล</text>

    <polygon points="660,13 686,26 660,39 634,26" class="dec" filter="url(#soft)"/>
    <text x="700" y="18" class="legend">เงื่อนไขตัดสินใจ</text>
  </g>

  <!-- เริ่มต้น -->
  <rect x="48" y="308" width="108" height="44" rx="22" class="term" filter="url(#soft)"/>
  <text x="102" y="336" text-anchor="middle" class="t">เริ่มต้น</text>
  <line x1="156" y1="330" x2="188" y2="330" class="line"/>

  <!-- รับข้อมูล -->
  <polygon points="188,298 360,298 344,362 172,362" class="io" filter="url(#soft)"/>
  <text x="266" y="324" text-anchor="middle" class="t">รับข้อมูลจากผู้ใช้</text>
  <text x="266" y="344" text-anchor="middle" class="s">เพศ อายุ น้ำหนัก ส่วนสูง</text>
  <line x1="360" y1="330" x2="396" y2="330" class="line"/>

  <!-- ข้อมูลถูกต้อง -->
  <polygon points="466,330 528,392 466,454 404,392" class="dec" filter="url(#soft)"/>
  <text x="466" y="386" text-anchor="middle" class="t">ข้อมูล</text>
  <text x="466" y="406" text-anchor="middle" class="t">ถูกต้อง?</text>

  <path d="M 466 454 L 466 540 L 266 540" class="line"/>
  <text x="478" y="506" class="e">ไม่</text>
  <polygon points="172,508 360,508 344,572 156,572" class="io" filter="url(#soft)"/>
  <text x="258" y="546" text-anchor="middle" class="t">แจ้งข้อผิดพลาด</text>
  <path d="M 266 508 L 266 362" class="line"/>

  <line x1="528" y1="330" x2="566" y2="330" class="line"/>
  <text x="534" y="318" class="e">ใช่</text>

  <!-- คำนวณ -->
  <rect x="566" y="302" width="120" height="56" rx="8" class="proc" filter="url(#soft)"/>
  <text x="626" y="336" text-anchor="middle" class="t">คำนวณ BMI</text>
  <line x1="686" y1="330" x2="716" y2="330" class="line"/>

  <rect x="716" y="294" width="150" height="72" rx="8" class="proc" filter="url(#soft)"/>
  <text x="791" y="324" text-anchor="middle" class="t">ประเมินเกณฑ์ BMI</text>
  <text x="791" y="344" text-anchor="middle" class="s">ผอม / สมส่วน / ท้วม</text>
  <line x1="866" y1="330" x2="896" y2="330" class="line"/>

  <rect x="896" y="302" width="120" height="56" rx="8" class="proc" filter="url(#soft)"/>
  <text x="956" y="336" text-anchor="middle" class="t">คำนวณ BMR</text>
  <line x1="1016" y1="330" x2="1046" y2="330" class="line"/>

  <rect x="1046" y="302" width="120" height="56" rx="8" class="proc" filter="url(#soft)"/>
  <text x="1106" y="336" text-anchor="middle" class="t">คำนวณ TDEE</text>
  <line x1="1166" y1="330" x2="1196" y2="330" class="line"/>

  <rect x="1196" y="294" width="150" height="72" rx="8" class="proc" filter="url(#soft)"/>
  <text x="1271" y="324" text-anchor="middle" class="t">หาแคลอรีต่อวัน</text>
  <text x="1271" y="344" text-anchor="middle" class="s">ตามเป้าหมาย</text>
  <line x1="1346" y1="330" x2="1376" y2="330" class="line"/>

  <rect x="1376" y="294" width="140" height="72" rx="8" class="proc" filter="url(#soft)"/>
  <text x="1446" y="324" text-anchor="middle" class="t">หาแคลอรีต่อมื้อ</text>
  <text x="1446" y="344" text-anchor="middle" class="s">หารด้วย 3</text>
  <line x1="1516" y1="330" x2="1548" y2="330" class="line"/>

  <!-- งบประมาณ -->
  <polygon points="1620,330 1692,402 1620,474 1548,402" class="dec" filter="url(#soft)"/>
  <text x="1620" y="392" text-anchor="middle" class="t">งบประมาณ</text>
  <text x="1620" y="412" text-anchor="middle" class="t">เท่าใด?</text>

  <path d="M 1620 330 L 1620 180 L 1740 180" class="line"/>
  <text x="1632" y="230" class="e">มากกว่า 100 บาท</text>
  <rect x="1740" y="154" width="160" height="52" rx="8" class="proc" filter="url(#soft)"/>
  <text x="1820" y="186" text-anchor="middle" class="t">เมนูราคาสูง</text>

  <path d="M 1692 402 L 1740 402" class="line"/>
  <text x="1696" y="390" class="e">40–100 บาท</text>
  <rect x="1740" y="376" width="160" height="52" rx="8" class="proc" filter="url(#soft)"/>
  <text x="1820" y="408" text-anchor="middle" class="t">เมนูราคาปานกลาง</text>

  <path d="M 1620 474 L 1620 560 L 1740 560" class="line"/>
  <text x="1632" y="528" class="e">น้อยกว่า 40 บาท</text>
  <rect x="1740" y="534" width="160" height="52" rx="8" class="proc" filter="url(#soft)"/>
  <text x="1820" y="566" text-anchor="middle" class="t">เมนูราคาประหยัด</text>

  <path d="M 1900 180 L 1944 180 L 1944 402" class="line"/>
  <path d="M 1900 402 L 1944 402" class="line"/>
  <path d="M 1900 560 L 1944 560 L 1944 402" class="line"/>
  <line x1="1944" y1="402" x2="1980" y2="402" class="line"/>

  <!-- เป้าหมาย -->
  <polygon points="2052,402 2124,474 2052,546 1980,474" class="dec" filter="url(#soft)"/>
  <text x="2052" y="468" text-anchor="middle" class="t">เป้าหมาย</text>
  <text x="2052" y="488" text-anchor="middle" class="t">คืออะไร?</text>

  <path d="M 2052 402 L 2052 180 L 2180 180" class="line"/>
  <text x="2064" y="240" class="e">เพิ่มน้ำหนัก</text>
  <rect x="2180" y="150" width="170" height="60" rx="8" class="proc" filter="url(#soft)"/>
  <text x="2265" y="176" text-anchor="middle" class="t">เลือกเมนู</text>
  <text x="2265" y="196" text-anchor="middle" class="s">แคลอรีสูง</text>

  <path d="M 2052 546 L 2052 560 L 2180 560" class="line"/>
  <text x="2064" y="540" class="e">ลด/คงน้ำหนัก</text>
  <rect x="2180" y="530" width="170" height="60" rx="8" class="proc" filter="url(#soft)"/>
  <text x="2265" y="556" text-anchor="middle" class="t">เลือกเมนู</text>
  <text x="2265" y="576" text-anchor="middle" class="s">ไม่เกินแคลอรีเป้า</text>

  <path d="M 2350 180 L 2394 180 L 2394 402" class="line"/>
  <path d="M 2350 560 L 2394 560 L 2394 402" class="line"/>
  <line x1="2394" y1="402" x2="2430" y2="402" class="line"/>

  <!-- พบเมนู -->
  <polygon points="2490,402 2550,462 2490,522 2430,462" class="dec" filter="url(#soft)"/>
  <text x="2490" y="456" text-anchor="middle" class="t">พบเมนู</text>
  <text x="2490" y="476" text-anchor="middle" class="t">หรือไม่?</text>

  <path d="M 2490 522 L 2490 590 L 2588 590" class="line"/>
  <text x="2502" y="566" class="e">ไม่</text>
  <polygon points="2588,566 2750,566 2736,614 2574,614" class="io" filter="url(#soft)"/>
  <text x="2662" y="596" text-anchor="middle" class="t">ไม่พบเมนูที่เหมาะสม</text>

  <line x1="2550" y1="402" x2="2588" y2="402" class="line"/>
  <text x="2554" y="390" class="e">ใช่</text>
  <polygon points="2588,368 2750,368 2736,436 2574,436" class="io" filter="url(#soft)"/>
  <text x="2662" y="392" text-anchor="middle" class="t">แสดงเมนูแนะนำ</text>
  <text x="2662" y="412" text-anchor="middle" class="s">พร้อมค่า BMI และ BMR</text>

  <!-- รวมไปจบ -->
  <path d="M 2750 402 L 2790 402 L 2790 590 L 2750 590" class="line"/>
  <line x1="2790" y1="496" x2="2830" y2="496" class="line"/>
  <rect x="2830" y="474" width="70" height="44" rx="22" class="term" filter="url(#soft)"/>
  <text x="2865" y="502" text-anchor="middle" class="t">จบ</text>
</svg>
